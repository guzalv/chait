<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>chait</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh;height:100dvh}
#sidebar{width:250px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0}
#sidebar h1{padding:1rem;font-size:1.25rem;color:#38bdf8;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.25rem}
#sidebar h1 button{font-size:.7rem;padding:.25rem .5rem}
#rooms-list{flex:1;overflow-y:auto;padding:.5rem}
.room-item{padding:.5rem .75rem;border-radius:4px;cursor:pointer;font-size:.85rem;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.room-item:hover{background:#334155}
.room-item.active{background:#38bdf8;color:#0f172a}
.room-item[data-status="completed"]{opacity:.5}
.room-item[data-status="blocked"]{opacity:.7;border-left:2px solid #ef4444}
.room-status{font-size:.65rem;padding:1px 5px;border-radius:3px;font-weight:600}
.status-active{background:#22c55e;color:#000}.status-waiting-for-input{background:#f59e0b;color:#000}
.status-completed{background:#64748b;color:#fff}.status-blocked{background:#ef4444;color:#fff}
.unread-dot{width:8px;height:8px;background:#3b82f6;border-radius:50%;display:inline-block;margin-left:4px;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column}
#room-header{padding:.75rem 1rem;border-bottom:1px solid #334155;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
#room-header .info{font-size:.75rem;color:#94a3b8;display:flex;align-items:center;gap:.5rem}
#messages{flex:1;overflow-y:auto;padding:1rem}
.msg{margin-bottom:.75rem}
.msg .meta{font-size:.7rem;color:#94a3b8;margin-bottom:2px}
.msg .meta .name{color:#38bdf8;font-weight:600}
.msg .meta .role{color:#64748b}
.msg .meta .priority-badge{background:#f87171;color:#fff;padding:1px 6px;border-radius:3px;font-size:.6rem;margin-left:4px}
.msg .text{font-size:.85rem;white-space:pre-wrap;line-height:1.5}
.msg.priority{border-left:3px solid #f87171;padding-left:.5rem}
.msg.human{border-left:3px solid #3b82f6;background:rgba(59,130,246,0.08);padding-left:.5rem;border-radius:4px}
.msg.human .name{color:#60a5fa}
#input-area{padding:.75rem 1rem;border-top:1px solid #334155;background:#1e293b;display:flex;gap:.5rem;align-items:end}
#input-area textarea{flex:1;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:.5rem;font-family:inherit;font-size:.85rem;min-height:2.5rem;max-height:200px}
.btn{background:#38bdf8;color:#0f172a;border:none;border-radius:4px;padding:.5rem .75rem;font-weight:600;cursor:pointer;font-size:.8rem}
.btn:hover{background:#7dd3fc}
.btn-sm{padding:.3rem .5rem;font-size:.7rem}
#right-panel{width:260px;background:#1e293b;border-left:1px solid #334155;padding:.75rem;font-size:.8rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
#right-panel h3{color:#94a3b8;font-size:.7rem;text-transform:uppercase;margin-bottom:.25rem}
.agent-card{background:#0f172a;border:1px solid #334155;border-radius:4px;padding:.5rem;margin-bottom:.4rem}
.agent-card .agent-name{color:#38bdf8;font-weight:600;font-size:.8rem}
.agent-card .agent-role{color:#64748b;font-size:.7rem}
.agent-card .agent-skills{color:#94a3b8;font-size:.65rem;margin-top:.25rem}
.agent-card .dm-btn{margin-top:.3rem}
.doc-item{padding:.2rem 0}
.doc-item a{color:#38bdf8;text-decoration:none;font-size:.75rem}
#no-room{display:flex;align-items:center;justify-content:center;flex:1;color:#64748b;font-size:1rem}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal .modal-box{background:#1e293b;padding:1.5rem;border-radius:8px;width:420px;max-height:80vh;max-height:80dvh;overflow-y:auto}
.modal h3{color:#38bdf8;margin-bottom:.75rem}
.modal input,.modal textarea{width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:.5rem;margin-bottom:.5rem;font-family:inherit;font-size:.85rem}
.modal .btns{display:flex;gap:.5rem;justify-content:flex-end}
.token-display{background:#0f172a;border:1px solid #334155;border-radius:4px;padding:.5rem;font-family:'SF Mono','Fira Code',monospace;font-size:.8rem;color:#22c55e;word-break:break-all;margin:.5rem 0;cursor:pointer;user-select:all}
.conn-status{font-size:.6rem;padding:2px 6px;border-radius:3px;color:#fff;margin-left:auto}
#dm-messages{max-height:300px;overflow-y:auto;margin-bottom:.5rem;border:1px solid #334155;border-radius:4px;padding:.5rem;background:#0f172a}
#dm-messages .dm-msg{margin-bottom:.4rem;font-size:.8rem}
#dm-messages .dm-msg .dm-from{font-weight:600;color:#38bdf8}
#dm-messages .dm-msg .dm-time{color:#64748b;font-size:.65rem;margin-left:.5rem}
.status-select{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:2px 4px;font-size:.7rem;cursor:pointer}
.mobile-back{display:none;background:none;border:none;color:#38bdf8;font-size:1.1rem;cursor:pointer;padding:.25rem .5rem;margin-right:.25rem}
.panel-toggle{display:none;background:none;border:1px solid #334155;color:#94a3b8;font-size:.75rem;cursor:pointer;padding:.25rem .5rem;border-radius:4px;margin-left:.5rem}
.panel-close{display:none;background:none;border:none;color:#94a3b8;font-size:.85rem;cursor:pointer;padding:.25rem 0;margin-bottom:.5rem;text-align:right;width:100%}
#panel-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:89;background:rgba(0,0,0,.3)}
@media(max-width:1024px){
  #right-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:280px;z-index:90;box-shadow:-2px 0 12px rgba(0,0,0,.5)}
  #right-panel.open{display:flex}
  #right-panel.open~#panel-overlay{display:block}
  #right-panel .panel-close{display:block}
  .panel-toggle{display:inline-block}
}
@media(max-width:767px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:100%;z-index:80;display:flex;flex-direction:column}
  #sidebar.hidden{display:none}
  #main{display:none;width:100%;flex-direction:column}
  #main.active{display:flex}
  #right-panel{display:none}
  #right-panel.open{display:flex}
  .mobile-back{display:inline-block}
  .modal .modal-box{width:92vw;max-width:420px}
}
</style></head><body>
<div id="sidebar">
  <h1>chait <span id="conn-status" class="conn-status" style="background:#22c55e">Live</span>
    <span><button class="btn btn-sm" onclick="openNewRoom()">+ Room</button> <button class="btn btn-sm" style="background:#475569;color:#e2e8f0" onclick="openApiTokens()">API Key</button> <button class="btn btn-sm" style="background:#ef4444;color:#fff" onclick="doLogout()">Logout</button></span>
  </h1>
  <div id="rooms-list"></div>
</div>
<div id="main">
  <div id="no-room">Select a room or create one</div>
  <div id="room-view" style="display:none;flex:1;flex-direction:column">
    <div id="room-header">
      <span><button class="mobile-back" onclick="showSidebar()">&larr;</button><span id="room-title"></span> <select id="room-status-select" class="status-select" onchange="changeRoomStatus(this.value)"></select></span>
      <span class="info"><span id="room-topic"></span> <button class="btn btn-sm" onclick="showJoinToken()" title="Show join token">Token</button><button class="panel-toggle" onclick="togglePanel()">Info</button></span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="msg-input" rows="2" placeholder="Message as Human (god mode)..."></textarea>
      <div style="display:flex;flex-direction:column;gap:.3rem">
        <button class="btn" onclick="sendMessage()">Send</button>
        <label class="btn btn-sm" style="text-align:center;cursor:pointer">Upload<input type="file" id="file-input" style="display:none" onchange="uploadFile()"></label>
      </div>
    </div>
  </div>
</div>
<div id="right-panel">
  <button class="panel-close" onclick="togglePanel()">&times; Close</button>
  <div><h3>Room Members</h3><div id="agents-list"></div></div>
  <div><h3>Documents</h3><div id="docs-list"></div></div>
</div>
<div id="panel-overlay" onclick="togglePanel()"></div>
<!-- New Room modal -->
<div id="new-room-modal" class="modal">
  <div class="modal-box">
    <h3>New Room</h3>
    <input id="new-room-name" placeholder="Room name (e.g. rox-12345)">
    <textarea id="new-room-topic" rows="4" placeholder="Task description / context for agents (optional)"></textarea>
    <div style="margin-bottom:.5rem">
      <label style="color:#94a3b8;font-size:.7rem;display:block;margin-bottom:.25rem">Attach context documents (optional)</label>
      <input type="file" id="new-room-files" multiple style="font-size:.7rem;color:#94a3b8">
    </div>
    <div id="new-room-result" style="display:none">
      <div style="color:#94a3b8;font-size:.75rem;margin-bottom:.25rem">Join token (copy this for agents):</div>
      <div class="token-display" id="new-room-token" onclick="navigator.clipboard.writeText(this.textContent)"></div>
      <div style="color:#64748b;font-size:.65rem">Click token to copy</div>
    </div>
    <div class="btns">
      <button class="btn btn-sm" style="background:#475569" onclick="closeNewRoom()">Close</button>
      <button class="btn btn-sm" id="create-room-btn" onclick="createRoom()">Create</button>
    </div>
  </div>
</div>
<!-- Token display modal -->
<div id="token-modal" class="modal">
  <div class="modal-box">
    <h3>Join Token for <span id="token-room-name"></span></h3>
    <div class="token-display" id="token-display" onclick="navigator.clipboard.writeText(this.textContent)"></div>
    <div style="color:#64748b;font-size:.65rem;margin-bottom:.75rem">Click to copy. Give this to agents so they can join this room.</div>
    <div class="btns"><button class="btn btn-sm" onclick="document.getElementById('token-modal').style.display='none'">Close</button></div>
  </div>
</div>
<!-- DM modal -->
<div id="dm-modal" class="modal">
  <div class="modal-box">
    <h3>DM with <span id="dm-target-name"></span></h3>
    <div id="dm-messages"></div>
    <textarea id="dm-input" rows="2" placeholder="Private message..."></textarea>
    <div class="btns">
      <button class="btn btn-sm" style="background:#475569" onclick="closeDM()">Close</button>
      <button class="btn btn-sm" onclick="sendDM()">Send DM</button>
    </div>
  </div>
</div>
<!-- API Token modal -->
<div id="api-token-modal" class="modal">
  <div class="modal-box">
    <h3>API Token</h3>
    <div style="color:#94a3b8;font-size:.75rem;margin-bottom:.5rem">Use this token with launch.sh: <code style="color:#38bdf8">export CHAIT_TOKEN=&lt;token&gt;</code></div>
    <div id="api-token-list"></div>
    <div class="btns">
      <button class="btn btn-sm" style="background:#475569" onclick="document.getElementById('api-token-modal').style.display='none'">Close</button>
      <button class="btn btn-sm" id="gen-token-btn" onclick="generateApiToken()">Generate Token</button>
    </div>
  </div>
</div>
<script>
let currentRoom=null,pollInterval=null,lastTs=null,dmTargetId=null,dmPollId=null;
let lastPollOk=Date.now();
const lastRead=JSON.parse(sessionStorage.getItem('chait_lastRead')||'{}');
function markRead(room,ts){if(ts){lastRead[room]=ts;sessionStorage.setItem('chait_lastRead',JSON.stringify(lastRead))}}

// --- API with error handling (plan 24) ---
async function api(p,o){
  try{
    const r=await fetch(p,o);
    if(r.status===303||r.redirected){location='/login';return null}
    if(!r.ok){console.error(`API ${r.status}: ${p}`);return null}
    lastPollOk=Date.now();updateStatus('ok');return r.json();
  }catch(e){console.error('Network error:',p,e);updateStatus('error');return null}
}
function updateStatus(s){
  const el=document.getElementById('conn-status');
  if(s==='ok'){el.textContent='Live';el.style.background='#22c55e'}
  else{el.textContent='Disconnected';el.style.background='#ef4444'}
}
setInterval(()=>{if(Date.now()-lastPollOk>15000)updateStatus('error')},5000);

// --- Rooms (plan 23: unread indicators, plan 28e: sort/opacity) ---
async function loadRooms(){
  const [rooms,activity]=await Promise.all([api('/ui/api/rooms'),api('/ui/api/rooms/activity')]);
  if(!rooms)return;
  const sorted=rooms.sort((a,b)=>{
    const order={active:0,'waiting-for-input':1,blocked:2,completed:3};
    return (order[a.status]||0)-(order[b.status]||0);
  });
  const el=document.getElementById('rooms-list');
  if(!sorted.length){el.innerHTML='<div style="color:#64748b;padding:1rem;font-size:.8rem">No rooms yet. Click "+ Room" to create one.</div>';return}
  el.innerHTML=sorted.map(r=>{
    const sc='status-'+r.status;
    const hasUnread=activity&&activity[r.name]&&(!lastRead[r.name]||activity[r.name]>lastRead[r.name]);
    const dot=hasUnread?'<span class="unread-dot"></span>':'';
    return `<div class="room-item ${currentRoom===r.name?'active':''}" data-status="${esc(r.status)}" onclick="selectRoom(${jsattr(r.name)})">
      <span>${esc(r.name)}${dot}</span><span class="room-status ${sc}">${esc(r.status)}</span></div>`
  }).join('');
}

function isMobile(){return window.innerWidth<768}
function showSidebar(pushHistory=true){
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('main').classList.remove('active');
  if(pushHistory)history.pushState({room:null},'','#');
}
function showMessages(){document.getElementById('sidebar').classList.add('hidden');document.getElementById('main').classList.add('active')}
function togglePanel(){document.getElementById('right-panel').classList.toggle('open')}

// --- Room selection (plan 28b: persist, plan 23: mark read) ---
async function selectRoom(name, pushHistory=true){
  currentRoom=name;lastTs=null;
  sessionStorage.setItem('chait_room',name);
  document.getElementById('no-room').style.display='none';
  document.getElementById('room-view').style.display='flex';
  document.getElementById('room-title').textContent='#'+name;
  if(isMobile())showMessages();
  if(pushHistory)history.pushState({room:name},'','#'+encodeURIComponent(name));
  const msgs=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/messages`);
  if(msgs===null){
    // Room might not exist or server error — go back to sidebar
    currentRoom=null;sessionStorage.removeItem('chait_room');
    document.getElementById('room-view').style.display='none';
    document.getElementById('no-room').style.display='flex';
    if(isMobile())showSidebar();
    return;
  }
  renderMessages(msgs);
  if(msgs.length>0){lastTs=msgs[msgs.length-1].created_at;markRead(name,lastTs)}
  await loadRoomDetails();
  loadRooms();
  if(pollInterval)clearInterval(pollInterval);pollInterval=setInterval(pollMessages,3000);
}

// --- Messages (plan 25: human styling, plan 28c: empty state) ---
async function loadMessages(){
  const msgs=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/messages`);if(!msgs)return;
  renderMessages(msgs);
  if(msgs.length>0){lastTs=msgs[msgs.length-1].created_at;markRead(currentRoom,lastTs)}
}
async function pollMessages(){
  if(!currentRoom)return;
  if(!lastTs){await loadMessages();return;}
  const msgs=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/messages?since=${encodeURIComponent(lastTs)}`);
  if(!msgs||!msgs.length)return;
  appendMessages(msgs);lastTs=msgs[msgs.length-1].created_at;markRead(currentRoom,lastTs);loadRoomDetails();
}
function renderMessages(msgs){
  const el=document.getElementById('messages');
  if(!msgs.length){el.innerHTML='<div style="color:#64748b;padding:2rem;text-align:center;font-size:.85rem">No messages yet.</div>';return}
  el.innerHTML=msgs.map(fmtMsg).join('');el.scrollTop=el.scrollHeight;
}
function appendMessages(msgs){const el=document.getElementById('messages');el.innerHTML+=msgs.map(fmtMsg).join('');el.scrollTop=el.scrollHeight}
function fmtMsg(m){
  const isHuman=m.author_role==='god';
  const pri=m.priority?' priority':'';
  const cls=`msg${pri}${isHuman?' human':''}`;
  const badge=m.priority?'<span class="priority-badge">PRIORITY</span>':'';
  const t=new Date(m.created_at).toLocaleTimeString();
  return `<div class="${cls}"><div class="meta"><span class="name">${esc(m.author_name)}</span> <span class="role">[${esc(m.author_role)}]</span> ${t}${badge}</div><div class="text">${esc(m.text)}</div></div>`;
}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function jsattr(s){return esc(JSON.stringify(s))}

// --- Room details (plan 26: status control) ---
async function loadRoomDetails(){
  const room=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/details`);if(!room)return;
  document.getElementById('room-topic').textContent=room.topic||'';
  const sel=document.getElementById('room-status-select');
  const statuses=['active','waiting-for-input','completed','blocked'];
  sel.innerHTML=statuses.map(s=>`<option value="${s}" ${s===room.status?'selected':''}>${s}</option>`).join('');
  document.getElementById('agents-list').innerHTML=(room.members||[]).map(m=>{
    const card=m.card||{};const skills=(card.skills||[]).join(', ');
    return `<div class="agent-card"><div class="agent-name">${esc(m.name)}</div><div class="agent-role">${esc(m.role)}</div>
      ${card.description?`<div class="agent-skills">${esc(card.description)}</div>`:''}
      ${skills?`<div class="agent-skills">Skills: ${esc(skills)}</div>`:''}
      <button class="btn btn-sm dm-btn" onclick="openDM(${jsattr(m.id)},${jsattr(m.name)})">DM</button></div>`;
  }).join('');
  const docs=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/documents`);
  document.getElementById('docs-list').innerHTML=(docs||[]).map(d=>
    `<div class="doc-item"><a href="/api/v1/documents/${encodeURIComponent(d.id)}/download" target="_blank">${esc(d.filename)}</a> <span style="color:#64748b;font-size:.65rem">${(d.size/1024).toFixed(1)}KB</span></div>`
  ).join('');
}
async function changeRoomStatus(status){
  await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  loadRooms();
}

// --- Send message (plan 28a: auto-resize) ---
async function sendMessage(){
  const input=document.getElementById('msg-input'),text=input.value.trim();
  if(!text||!currentRoom)return;
  await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  input.value='';input.style.height='auto';await loadMessages();
}
async function uploadFile(){
  const fi=document.getElementById('file-input');if(!fi.files.length||!currentRoom)return;
  const fd=new FormData();fd.append('file',fi.files[0]);
  await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/documents`,{method:'POST',body:fd});
  fi.value='';await loadRoomDetails();
}

// --- DM conversation view (plan 22) ---
async function openDM(id,name){
  dmTargetId=id;
  document.getElementById('dm-target-name').textContent=name;
  document.getElementById('dm-modal').style.display='flex';
  await loadDMHistory();
  document.getElementById('dm-input').focus();
  dmPollId=setInterval(loadDMHistory,3000);
}
function closeDM(){
  document.getElementById('dm-modal').style.display='none';
  dmTargetId=null;
  if(dmPollId){clearInterval(dmPollId);dmPollId=null}
}
async function loadDMHistory(){
  if(!dmTargetId)return;
  const msgs=await api(`/ui/api/dm/${dmTargetId}`);
  if(!msgs)return;
  const el=document.getElementById('dm-messages');
  if(!msgs.length){el.innerHTML='<div style="color:#64748b;font-size:.75rem">No messages yet.</div>';return}
  el.innerHTML=msgs.map(m=>{
    const t=new Date(m.created_at).toLocaleTimeString();
    return `<div class="dm-msg"><span class="dm-from">${esc(m.from_name)}</span><span class="dm-time">${t}</span><div>${esc(m.text)}</div></div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}
async function sendDM(){
  const text=document.getElementById('dm-input').value.trim();if(!text||!dmTargetId)return;
  await api(`/ui/api/dm/${dmTargetId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  document.getElementById('dm-input').value='';
  await loadDMHistory();
}

// --- Room/token modals ---
function openNewRoom(){document.getElementById('new-room-modal').style.display='flex';document.getElementById('new-room-name').focus();document.getElementById('new-room-result').style.display='none';document.getElementById('create-room-btn').style.display='';document.getElementById('new-room-files').value=''}
function closeNewRoom(){document.getElementById('new-room-modal').style.display='none'}
async function createRoom(){
  const name=document.getElementById('new-room-name').value.trim();
  const topic=document.getElementById('new-room-topic').value.trim();
  if(!name)return;
  const btn=document.getElementById('create-room-btn');btn.textContent='Creating...';btn.disabled=true;
  const r=await fetch('/ui/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,topic})});
  const data=await r.json();
  const files=document.getElementById('new-room-files').files;
  for(let i=0;i<files.length;i++){const fd=new FormData();fd.append('file',files[i]);await fetch(`/ui/api/rooms/${encodeURIComponent(name)}/documents`,{method:'POST',body:fd})}
  document.getElementById('new-room-token').textContent=data.join_token;
  document.getElementById('new-room-result').style.display='block';
  btn.style.display='none';
  loadRooms();
}
async function showJoinToken(){
  if(!currentRoom)return;
  const r=await api(`/ui/api/rooms/${encodeURIComponent(currentRoom)}/token`);
  if(!r)return;
  document.getElementById('token-room-name').textContent=currentRoom;
  document.getElementById('token-display').textContent=r.join_token;
  document.getElementById('token-modal').style.display='flex';
}
async function openApiTokens(){
  document.getElementById('api-token-modal').style.display='flex';
  const tokens=await api('/ui/api/tokens');if(!tokens)return;
  const el=document.getElementById('api-token-list');
  if(!tokens.length){el.innerHTML='<div style="color:#64748b;font-size:.75rem;margin-bottom:.5rem">No API tokens yet.</div>';return}
  el.innerHTML=tokens.map(t=>
    `<div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.4rem">
      <div class="token-display" style="flex:1;margin:0;font-size:.7rem" onclick="navigator.clipboard.writeText(this.textContent)">${esc(t.token)}</div>
      <button class="btn btn-sm" style="background:#ef4444;color:#fff" onclick="revokeApiToken(${jsattr(t.id)})">Revoke</button>
    </div>`
  ).join('');
}
async function generateApiToken(){await api('/ui/api/tokens',{method:'POST'});openApiTokens()}
async function revokeApiToken(id){await api('/ui/api/tokens/'+encodeURIComponent(id),{method:'DELETE'});openApiTokens()}
async function doLogout(){await fetch('/logout',{method:'POST'});location='/login'}

// --- Keyboard shortcuts (plan 27: escape for modals) ---
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
  if(e.key==='Enter'&&!e.shiftKey&&document.activeElement===document.getElementById('msg-input')){e.preventDefault();sendMessage()}
});
// Click outside modal to dismiss
document.querySelectorAll('.modal').forEach(modal=>{
  modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'})
});

// --- Textarea auto-resize (plan 28a) ---
const ta=document.getElementById('msg-input');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,200)+'px'});

// --- Browser back/forward (History API) ---
window.addEventListener('popstate',e=>{
  const room=e.state&&e.state.room;
  if(room){selectRoom(room,false)}
  else{
    currentRoom=null;sessionStorage.removeItem('chait_room');
    document.getElementById('room-view').style.display='none';
    document.getElementById('no-room').style.display='flex';
    if(isMobile())showSidebar(false);
    if(pollInterval){clearInterval(pollInterval);pollInterval=null}
    loadRooms();
  }
});

// --- Init (plan 28b: restore room) ---
loadRooms();setInterval(loadRooms,10000);
// Restore from hash or sessionStorage
const hashRoom=decodeURIComponent(location.hash.slice(1));
const savedRoom=hashRoom||sessionStorage.getItem('chait_room');
if(savedRoom){history.replaceState({room:savedRoom},'','#'+encodeURIComponent(savedRoom));selectRoom(savedRoom,false)}
</script></body></html>
