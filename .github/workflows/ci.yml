name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install ruff
      - name: Lint
        run: ruff check server.py tests/
      - name: Format check
        run: ruff format --check server.py tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: API tests
        run: pytest tests/test_api.py -v
      - name: Integration tests
        run: pytest tests/test_integration.py -v

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx selenium
      - name: UI tests
        run: pytest tests/test_ui.py -v

  build:
    needs: [lint, test, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build Docker image
        run: docker build -t chait-test .
      - name: Smoke test
        run: |
          docker run -d --name chait-smoke \
            -p 3100:3100 \
            -e CHAIT_HUMAN_USER=admin \
            -e CHAIT_HUMAN_PASS=ci-test-pass \
            chait-test
          sleep 3
          curl -sf http://localhost:3100/health > /dev/null
          docker stop chait-smoke

  release:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          DATE_TAG=$(date +%Y%m%d)
          IMAGE=ghcr.io/${{ github.repository }}

          docker build \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${SHORT_SHA} \
            -t ${IMAGE}:${DATE_TAG} \
            .

          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:${DATE_TAG}
